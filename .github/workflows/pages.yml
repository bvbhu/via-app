name: Deploy to Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: npm run build
      # GitHub Pages has no SPA fallback: copy the built index to 404.html so a
      # refresh / deep link on a client route (e.g. /via-app/test) still serves
      # the app, which then routes itself via wouter.
      - run: |
          node -e "require('fs').copyFileSync('dist/index.html','dist/404.html')"
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
